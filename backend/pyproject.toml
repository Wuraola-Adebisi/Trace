[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-api"
version = "0.1.0"
description = "Document ingestion and AI orchestration API for Trace."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
